name: Update prices

on:
  schedule:
    # Every Monday at 06:00 UTC. Provider prices change rarely; the app checks daily.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # A hand edit to prices.json is published straight away (the `publish` job).
  push:
    branches: [main]
    paths: [prices.json]

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download the official pricing pages
        run: python3 scripts/fetch_sources.py

      - name: Check prices against the providers' official pricing pages
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token; without it the action asks GitHub for an OIDC token to use
          # the Claude GitHub App, which this repo doesn't need.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "WebFetch,WebSearch,Read,Edit,Write"
          prompt: |
            You maintain prices.json, the price list the Imogen Pro Mac app uses to estimate and
            record what AI image and video generations cost.

            Each entry in `rates` is a price in US dollars, keyed by rate ID; the part before the
            first "/" or "." is the provider. `details` says what each rate is (label, unit,
            provider, model). The workflow has already downloaded each provider's official pricing
            pages as text into sources/<provider>.txt (the URLs are in sources.json). Each page
            starts with a "=== URL ===" line; one that says FAILED couldn't be downloaded.

            Do this:
            1. For each provider with rates, read sources/<provider>.txt. The files can be long:
               read them in parts until you've seen every section. If they don't settle a rate,
               you may use WebFetch or WebSearch, but only on the provider's own official pages,
               never resellers, blogs or aggregators.
            2. For every rate of that provider, find the current published price for exactly
               what the label and unit describe (same resolution, tier, audio on/off, per
               second vs per image, and so on). Convert to US dollars per the unit given.
            3. Use the regular list price. Ignore temporary promotions, launch discounts and
               free trials. A rate may follow from an official formula or example on the page
               (for example a 10-second job price ÷ 10 for a per-second rate).
               Change a rate only when an official source clearly states a different price.
               If you can't find or verify a price, leave it unchanged. Never guess. Never add,
               remove or rename rates, and never change `details`, `pricingPages`, `updatedAt`
               or `version` (a later step sets the dates from your results).
            4. Keep the file's formatting: 2-space indentation and sorted keys.
            5. Write check-result.json as {"verified": [...], "unverified": [...]} with provider
               names. A provider is verified only if you confirmed every one of its rates
               against an official source in this run; otherwise it's unverified.
            6. Write update-summary.md: a first line under 70 characters, a blank line, then
               one line per changed rate ("id: old -> new, source URL"), or "No price changes"
               if nothing changed, then each unverified provider or rate and why.

            Edit only prices.json, check-result.json and update-summary.md.

      - name: Set the check date
        run: python3 scripts/stamp.py

      - name: Validate the price list
        run: python3 scripts/validate.py

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- prices.json; then
            echo "Nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if [ -f update-summary.md ]; then
            git commit -F update-summary.md
          else
            git commit -m "Update prices"
          fi
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The app reads https://imogenpro.com/catalog/prices.json, not this repo. (A push made with
      # the workflow's token doesn't start the `publish` job, so this job uploads its own commit.)
      - name: Upload to imogenpro.com
        if: steps.commit.outputs.changed == 'true'
        env:
          CATALOG_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY }}
        run: scripts/upload.sh

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate the price list
        run: python3 scripts/validate.py

      - name: Upload to imogenpro.com
        env:
          CATALOG_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY }}
        run: scripts/upload.sh
